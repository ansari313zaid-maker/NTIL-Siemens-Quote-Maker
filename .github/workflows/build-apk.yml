name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        run: |
          rm -rf project
          mkdir project
          unzip -q NTIL_Siemens_GitHub_Upload.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Project Directory
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Check Android Project
        run: |
          echo "Checking project..."
          ls -la "$PROJECT_DIR"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NTIL-Siemens-Quote-Maker-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
