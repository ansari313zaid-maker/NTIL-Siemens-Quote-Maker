name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          rm -rf project
          mkdir -p project

          echo "Extracting Android project..."
          unzip -q NTIL_Siemens_GitHub_Upload.zip -d project

          echo "Project files:"
          find project -maxdepth 6 -type f | sort

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin Compose Compiler
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Checking Android project..."

          test -f "app/build.gradle.kts"

          echo "Checking root build.gradle.kts..."

          if [ -f "build.gradle.kts" ]; then
            if ! grep -q 'org.jetbrains.kotlin.plugin.compose' "build.gradle.kts"; then
              sed -i '/^plugins {/a\    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' build.gradle.kts
              echo "Added Compose plugin to root build.gradle.kts"
            else
              echo "Compose plugin already exists in root build.gradle.kts"
            fi
          fi

          echo "Checking app/build.gradle.kts..."

          if ! grep -q 'org.jetbrains.kotlin.plugin.compose' "app/build.gradle.kts"; then
            sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.plugin.compose")' app/build.gradle.kts
            echo "Added Compose plugin to app/build.gradle.kts"
          else
            echo "Compose plugin already exists in app/build.gradle.kts"
          fi

          echo "Final plugins section:"
          sed -n '1,40p' app/build.gradle.kts

      - name: Check Android Project
        run: |
          echo "Checking Android project..."

          ls -la "$PROJECT_DIR"

          echo "Checking app folder..."
          test -d "$PROJECT_DIR/app"

          echo "Checking settings.gradle.kts..."
          test -f "$PROJECT_DIR/settings.gradle.kts"

          echo "Checking app/build.gradle.kts..."
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Android project is ready."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Gradle version:"
          gradle --version

          echo "Starting APK build..."

          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Check APK
        run: |
          echo "Checking generated APK..."

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "APK generated successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NTIL-Siemens-Quote-Maker-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
