name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        run: |
          rm -rf project
          mkdir project

          echo "Extracting Android project..."
          unzip -q NTIL_Siemens_GitHub_Upload.zip -d project

          echo "Extracted structure:"
          find project -maxdepth 4 -type f | head -150

      - name: Find Android Project
        run: |
          echo "Searching for settings.gradle.kts..."

          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Find Gradle Wrapper
        run: |
          echo "Searching for gradlew..."

          GRADLEW=$(find project -name gradlew -type f -print | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP"
            echo "All files:"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "GRADLEW=$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Check Android Project
        run: |
          echo "Checking Android project..."

          ls -la "$PROJECT_DIR"

          echo "Checking app folder..."
          test -d "$PROJECT_DIR/app"

          echo "Checking settings.gradle.kts..."
          test -f "$PROJECT_DIR/settings.gradle.kts"

          echo "Checking app/build.gradle.kts..."
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Android project looks OK."

      - name: Build Debug APK
        run: |
          chmod +x "$GRADLEW"

          echo "Starting Gradle build..."
          "$GRADLEW" \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Check APK
        run: |
          echo "Searching for generated APK..."

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "APK generated successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NTIL-Siemens-Quote-Maker-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
