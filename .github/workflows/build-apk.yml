name: Build NTIL Quotation Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          echo "Repository files:"
          ls -lah
          test -f NTIL_Siemens_GitHub_Upload.zip

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q NTIL_Siemens_GitHub_Upload.zip -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f | head -200

      - name: Locate Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        run: |
          echo "Checking project..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -d "$PROJECT_DIR/app"

          echo "Android project OK"

      - name: Fix Material3 opt-in
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/ntil/quotationmaker/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          if ! grep -q "@file:OptIn" "$FILE"; then
            sed -i '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' "$FILE"
          fi

          echo "Material3 opt-in added/verified."

          echo "First lines of MainActivity.kt:"
          head -10 "$FILE"

      - name: Fix Compose plugin
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          root_file = root / "build.gradle.kts"
          app_file = root / "app" / "build.gradle.kts"

          root_text = root_file.read_text()

          if "org.jetbrains.kotlin.plugin.compose" not in root_text:

              marker = 'id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false'

              if marker in root_text:
                  root_text = root_text.replace(
                      marker,
                      marker + '\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false"
                  )
              else:
                  root_text = root_text.replace(
                      "plugins {",
                      'plugins {\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false',
                      1
                  )

              root_file.write_text(root_text)

          app_text = app_file.read_text()

          if 'id("org.jetbrains.kotlin.plugin.compose")' not in app_text:

              marker = 'id("org.jetbrains.kotlin.plugin.serialization")'

              if marker in app_text:
                  app_text = app_text.replace(
                      marker,
                      'id("org.jetbrains.kotlin.plugin.compose")\n    ' + marker,
                      1
                  )
              else:
                  app_text = app_text.replace(
                      "plugins {",
                      'plugins {\n    id("org.jetbrains.kotlin.plugin.compose")',
                      1
                  )

              app_file.write_text(app_text)

          print("Compose plugin check completed.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NTIL-Quotation-Maker-debug-apk-${{ github.run_id }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
