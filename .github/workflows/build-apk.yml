 name: Build NTIL Quotation Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          echo "Checking uploaded project ZIP..."
          ls -lh
          test -f NTIL_Siemens_GitHub_Upload.zip

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q NTIL_Siemens_GitHub_Upload.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          if [ -f "project/settings.gradle.kts" ]; then
            echo "Project found at project/"
          elif [ -f "project/NTIL_Quotation_Maker_Siemens/settings.gradle.kts" ]; then
            echo "Project found in nested folder"
            mv project/NTIL_Quotation_Maker_Siemens/* project/
            mv project/NTIL_Quotation_Maker_Siemens/.[!.]* project/ 2>/dev/null || true
          else
            echo "Android project not found"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NTIL-Quotation-Maker-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
